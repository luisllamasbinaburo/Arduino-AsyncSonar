sentence=Non-blocking (asynchronous) library for HC-SR04 and similar ultrasonic sensors, using one or two pins.
paragraph=Measures distance without blocking loop(), using Pin Change Interrupts. Supports one-pin and two-pin wiring, callbacks, timeouts, temperature correction, a fast 5-sample median filter and chaining several sensors so they fire in sequence without interfering.
